function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function safeUrl(u){
  try{
    const url=new URL(u);
    if(!/^https?:$/.test(url.protocol)) return null;
    if(/(^|\.)bantuguruyuk\.web\.id$/.test(url.hostname)){
      if(!url.searchParams.has('utm_source')) url.searchParams.set('utm_source','tiktok');
      if(!url.searchParams.has('utm_medium')) url.searchParams.set('utm_medium','bio');
    }
    return url.href;
  }catch(e){return null;}
}
function render(list){
  const box=document.getElementById('links');
  box.innerHTML=list.map((l,i)=>{
    const href=safeUrl(l.url); if(!href) return '';
    const icon=ICONS[l.icon]||ICONS.link;
    return `<a class="lk${i===0?' first':''}" href="${esc(href)}" rel="noopener" data-id="${l.id||''}" data-title="${esc(l.title)}">
      <span class="lk-ic${l.icon==='whatsapp'?' wa':''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icon}</svg></span>
      <span class="lk-txt"><span class="lk-title" style="display:block;">${esc(l.title)}</span>${l.subtitle?`<span class="lk-sub" style="display:block;">${esc(l.subtitle)}</span>`:''}</span>
      ${l.badge?`<span class="lk-badge">${esc(l.badge)}</span>`:''}
      <svg class="lk-arrow" aria-hidden="true"><use href="#i-arrow"/></svg></a>`;
  }).join('');
}
document.getElementById('links').addEventListener('click',e=>{
  const a=e.target.closest('a.lk'); if(!a) return;
  if(typeof gtag==='function') gtag('event','bio_click',{link_title:a.dataset.title});
  if(a.dataset.id){
    try{fetch(SB_URL+'/rest/v1/rpc/bgy_bio_click',{method:'POST',headers:SB_HEAD,body:JSON.stringify({p_id:Number(a.dataset.id)}),keepalive:true});}catch(err){}
  }
});

async function load(){
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),6000);
  try{
    const r=await fetch(SB_URL+'/rest/v1/bgy_bio_links?select=id,title,subtitle,url,icon,badge&active=eq.true&order=sort.asc,id.asc',{headers:SB_HEAD,signal:ctl.signal});
    const data=await r.json();
    render(r.ok&&Array.isArray(data)&&data.length?data:FALLBACK);
  }catch(e){render(FALLBACK);}
  finally{clearTimeout(t);}
}
async function loadRating(){
  try{
    const r=await fetch(SB_URL+'/rest/v1/rpc/bgy_review_stats',{method:'POST',headers:SB_HEAD,body:'{}'});
    const d=(await r.json())[0];
    if(r.ok&&d&&Number(d.total)>=3){
      document.getElementById('ratingTxt').textContent=String(d.avg_rating).replace('.',',')+' dari '+d.total+' ulasan guru';
      document.getElementById('rating').hidden=false;
    }
  }catch(e){}
}

function setIcon(){document.getElementById('darkIcon').setAttribute('href',document.body.classList.contains('dark')?'#i-sun':'#i-moon');}
function toggleDark(){document.body.classList.toggle('dark');try{localStorage.setItem('theme',document.body.classList.contains('dark')?'dark':'light');}catch(e){}setIcon();}
try{if(localStorage.getItem('theme')==='dark')document.body.classList.add('dark');}catch(e){}
